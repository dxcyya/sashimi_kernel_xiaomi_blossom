on:
  push:
    branches: [ sashimi ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies & clang14
        run: |
          sudo apt update
          sudo apt install -y bison flex bc libssl-dev zip python3
          sudo apt install -y clang-14 gcc-aarch64-linux-gnu

      - name: Fix armv8a typo
        run: |
          find . -type f \( -name "Makefile*" -o -name "*.mk" -o -name "*.sh" \) -exec sed -i 's/mcpu=armv8a/mcpu=armv8-a/g' {} +

      - name: Generate defconfig
        run: |
          make O=out ARCH=arm64 CC=clang-14 CROSS_COMPILE=aarch64-linux-gnu- LLVM_IAS=0 blossom_defconfig

      - name: Build kernel
        run: |
          make O=out ARCH=arm64 \
            CC=clang-14 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            LLVM_IAS=0 \
            -j$(nproc)

      - name: Show output
        run: ls -lh out/arch/arm64/boot/
      - name: Upload kernel artifact
        uses: actions/upload-artifact@v4
        with:
          name: blossom-kernel
          path: |
            out/arch/arm64/boot/Image.gz-dtb
            out/arch/arm64/boot/Image.gz
