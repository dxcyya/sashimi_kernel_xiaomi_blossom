name: Build Kernel
on:
  push:
    branches: [ sashimi ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential clang lld bison flex libssl-dev bc git python3

      - name: Download aarch64 gcc
        run: |
          git clone https://github.com/osm0sis/arm64-gcc.git gcc
          echo "$PWD/gcc/bin" >> $GITHUB_PATH

      - name: Build
        run: |
          make O=out ARCH=arm64 blossom_defconfig
          make O=out ARCH=arm64 -j$(nproc) CC=clang LD=lld

      - name: Upload boot.img
        uses: actions/upload-artifact@v4
        with:
          name: kernel-artifact
          path: out/arch/arm64/boot/Image.gz-dtb
